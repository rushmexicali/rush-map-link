<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cómo llegar a RUSH Car Wash</title>
  <!--
    Destino de los QR impresos de RUSH Car Wash. Abre la app de mapas con la
    RUTA en coche ya trazada hacia el local, lista para darle "Iniciar":
      - iPhone / iPad  -> Apple Maps
      - todo lo demas  -> Google Maps
    Sin librerias externas a proposito: la primera version dependia de
    cdn.skypack.dev y dejo de funcionar cuando ese servicio fallo.

    Hay dos copias identicas de este archivo, una por cada QR impreso:
      - rushcarwashmexicali.com/mapa            (repo webpage-rush, mapa/index.html)
      - rushmexicali.github.io/rush-map-link/   (repo rush-map-link, index.html)
    Si cambia el destino hay que editar las dos.
  -->
  <meta http-equiv="refresh" content="1; url=https://www.google.com/maps/dir/?api=1&amp;destination=RUSH+Car+Wash+Mexicali&amp;destination_place_id=ChIJJWSCiS5x14ARrOy1vQiv91s&amp;travelmode=driving">
  <script>
    (function () {
      // Ruta en coche a la ficha de RUSH en Google Maps (place_id de la ficha).
      var GOOGLE = 'https://www.google.com/maps/dir/?api=1&destination=RUSH+Car+Wash+Mexicali&destination_place_id=ChIJJWSCiS5x14ARrOy1vQiv91s&travelmode=driving';
      // Ruta en coche en Apple Maps. Va por nombre porque Apple tiene la ficha
      // "Rush Car Wash Mexicali" (Calzada de Las Americas 951); con coordenadas
      // mostraba una direccion ajena en vez del negocio. Sin sll: con ese parametro
      // abria una busqueda en lugar de la ruta.
      var APPLE = 'https://maps.apple.com/?daddr=RUSH+Car+Wash+Mexicali&dirflg=d';

      var ua = navigator.userAgent || '';
      // Los iPad nuevos se anuncian como Mac: se distinguen por la pantalla tactil.
      var esApple = /iPhone|iPad|iPod/.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

      window.RUSH_DESTINO = esApple ? APPLE : GOOGLE;
      window.location.replace(window.RUSH_DESTINO);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: 22px; color: #ffd600; letter-spacing: 1px; }
    p { margin: 0; font-size: 16px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 10px;
      background: #ffd600;
      color: #111;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>RUSH CAR WASH</h1>
  <p>Abriendo la ruta en tu app de mapas…</p>
  <a class="btn" id="ir" href="https://www.google.com/maps/dir/?api=1&amp;destination=RUSH+Car+Wash+Mexicali&amp;destination_place_id=ChIJJWSCiS5x14ARrOy1vQiv91s&amp;travelmode=driving">CÓMO LLEGAR</a>
  <p>Calzada de las Américas y Río Culiacán 951,<br>Mexicali, B.C.</p>
  <script>
    // El boton de respaldo lleva al mismo destino que la redireccion.
    if (window.RUSH_DESTINO) document.getElementById('ir').href = window.RUSH_DESTINO;
  </script>
</body>
</html>
