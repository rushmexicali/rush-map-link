<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cómo llegar a RUSH Car Wash</title>
  <!--
    Destino del QR impreso en las tarjetas de RUSH Car Wash.
    Esta direccion (rushmexicali.github.io/rush-map-link/) esta impresa: no
    se puede cambiar. Lo que si se puede cambiar es a donde manda: es el
    enlace de abajo, que aparece tres veces (meta, script y boton).
    Sin librerias externas a proposito: la version anterior dependia de
    cdn.skypack.dev y dejo de funcionar cuando ese servicio fallo.
  -->
  <meta http-equiv="refresh" content="0; url=https://maps.app.goo.gl/Di6qdCznT4uak2A59">
  <script>
    window.location.replace('https://maps.app.goo.gl/Di6qdCznT4uak2A59');
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: 22px; color: #ffd600; letter-spacing: 1px; }
    p { margin: 0; font-size: 16px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 10px;
      background: #ffd600;
      color: #111;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>RUSH CAR WASH</h1>
  <p>Abriendo el mapa…</p>
  <a class="btn" href="https://maps.app.goo.gl/Di6qdCznT4uak2A59">CÓMO LLEGAR</a>
  <p>Calzada de las Américas y Río Culiacán 951,<br>Mexicali, B.C.</p>
</body>
</html>
